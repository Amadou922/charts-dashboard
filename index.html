<title>Trading Dashboard</title><style>

header{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}

a{color:var(--ac)}button,select,input{background:#0d1117;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font:inherit}

input{min-width:240px;flex:1}.frame{width:100%;height:480px;border:0;border-radius:8px;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}.cell h3{font-size:13px;margin:0 0 6px}.cell .frame{height:360px}
.btn{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;text-decoration:none}.lw{color:#d29922;margin-top:6px}.fb{margin:6px 0 0}.ph{height:360px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--bd);border-radius:8px;color:var(--mu)}
code{font:12px ui-monospace,monospace;word-break:break-all}.w{padding:10px 0;border-bottom:1px solid var(--bd)}.w:last-child{border:0}
@media(max-width:600px){.grid{grid-template-columns:1fr}.frame{height:380px}input{min-width:0}}
